          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ${{ secrets.VM2_APP_DIR }}

            echo "==> Sync with GitHub (dev)"
            git fetch origin
            git reset --hard origin/dev

            echo "==> Write dev env"
            cat > .env.production <<EOF
            DB_USER="${{ secrets.VM2_DB_USER }}"
            DB_PASSWORD="${{ secrets.VM2_DB_PASSWORD }}"
            DB_CONNECTION_STRING="${{ secrets.VM2_DB_CONNECTION_STRING }}"
            DB_WALLET_LOCATION="${{ secrets.VM2_DB_WALLET_LOCATION }}"
            DB_WALLET_PASSWORD="${{ secrets.VM2_DB_WALLET_PASSWORD }}"
            OCI_TENANCY_ID="${{ secrets.OCI_TENANCY_ID }}"
            OCI_USER_ID="${{ secrets.OCI_USER_ID }}"
            OCI_FINGERPRINT="${{ secrets.OCI_FINGERPRINT }}"
            OCI_PRIVATE_KEY="${{ secrets.OCI_PRIVATE_KEY }}"
            OCI_REGION="${{ secrets.OCI_REGION }}"
            OCI_NAMESPACE="${{ secrets.OCI_NAMESPACE }}"
            OCI_BUCKET_NAME="${{ secrets.VM2_OCI_BUCKET_NAME }}"
            EOF

            echo "==> Install dependencies"
            npm ci

            echo "==> Build Next.js app"
            npm run build

            echo "==> Restart app with PM2"
            if pm2 describe myblog > /dev/null 2>&1; then
              pm2 restart myblog --update-env
            else
              pm2 start npm --name myblog -- start -- --port 3000
            fi

            pm2 save
            echo "==> VM2 Deployment finished"