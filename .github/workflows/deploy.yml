name: Deploy to OCI VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on OCI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ${{ secrets.APP_DIR }}

            echo "==> Current directory"
            pwd

            echo "==> Sync with GitHub"
            git fetch origin
            git reset --hard origin/main

            echo "==> Write production env"
            cat > .env.production <<EOF
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
            DB_WALLET_LOCATION=${{ secrets.DB_WALLET_LOCATION }}
            DB_WALLET_PASSWORD=${{ secrets.DB_WALLET_PASSWORD }}
            OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
            OCI_USER_ID=${{ secrets.OCI_USER_ID }}
            OCI_FINGERPRINT=${{ secrets.OCI_FINGERPRINT }}
            OCI_PRIVATE_KEY=${{ secrets.OCI_PRIVATE_KEY }}
            OCI_REGION=${{ secrets.OCI_REGION }}
            OCI_NAMESPACE=${{ secrets.OCI_NAMESPACE }}
            OCI_BUCKET_NAME=${{ secrets.OCI_BUCKET_NAME }}
            EOF

            echo "==> Install dependencies"
            npm ci

            echo "==> Build Next.js app"
            npm run build

            echo "==> Restart app with PM2"
            if pm2 describe myblog > /dev/null; then
              pm2 restart myblog --update-env
            else
              pm2 start npm --name myblog -- start -- --port 3000
            fi

            echo "==> Save PM2 process list"
            pm2 save

            echo "==> Deployment finished"